<!DOCTYPE html>
<html lang="zh-TW" class="h-full bg-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>埔里會眾展示架安排系統</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Inter & Noto Sans TC Web Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'Noto Sans TC', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#f0fdfa',
              100: '#ccfbf1',
              500: '#14b8a6',
              600: '#0d9488',
              700: '#0f766e',
              800: '#115e59',
            }
          }
        }
      }
    }
  </script>

  <style>
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
    .text-2xs {
      font-size: 0.65rem;
      line-height: 0.85rem;
    }
  </style>
</head>
<body class="h-full text-slate-800 antialiased flex flex-col font-sans">

  <div id="toastContainer" class="fixed top-4 right-4 z-50 flex flex-col gap-2 pointer-events-none max-w-sm w-full px-4"></div>

  <header class="bg-gradient-to-r from-teal-700 via-teal-600 to-teal-800 text-white shadow-md sticky top-0 z-30">
    <div class="max-w-4xl mx-auto px-4 py-4 sm:px-6">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
        
        <!-- Logo & Title -->
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-white/10 backdrop-blur-sm border border-white/20 flex items-center justify-center shrink-0 shadow-inner">
            <i class="fa-solid fa-calendar-check text-xl text-teal-200"></i>
          </div>
          <div>
            <h1 class="text-xl sm:text-2xl font-bold tracking-tight text-white flex items-center gap-2">
              埔里會眾展示架安排
            </h1>
            <p id="targetWeekBadge" class="text-xs text-teal-100/90 font-medium mt-0.5 flex items-center gap-1.5">
              <i class="fa-regular fa-clock text-teal-200"></i>
              <span>載入中...</span>
            </p>
          </div>
        </div>

        <!-- Top Controls -->
        <div class="flex items-center gap-2 flex-wrap">
          <!-- Admin Status Lock Switcher -->
          <button id="adminStatusBtn" onclick="toggleAdminLock()" 
            class="px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition shadow-sm bg-teal-800/60 hover:bg-teal-800 text-teal-100 border border-teal-500/30">
            <i id="adminLockIcon" class="fa-solid fa-lock text-amber-300"></i>
            <span id="adminStatusText">管理者權限: 已鎖定</span>
          </button>

          <!-- Time Simulation Modal Switcher -->
          <button onclick="toggleTimeSimModal()" 
            title="測試每週六 16:00 自動輪替日期機制"
            class="px-2.5 py-1.5 rounded-lg text-xs font-medium bg-white/10 hover:bg-white/20 text-white border border-white/20 transition flex items-center gap-1">
            <i class="fa-solid fa-vial text-teal-200"></i>
            <span class="hidden sm:inline">時間模擬</span>
          </button>
        </div>

      </div>
    </div>
  </header>

  <main class="flex-1 max-w-4xl w-full mx-auto px-3 sm:px-6 py-5 space-y-5">

    <!-- Tab Navigation Header -->
    <div class="bg-white rounded-2xl p-1.5 shadow-sm border border-slate-200 flex text-sm font-semibold">
      <button id="tabBtnForm" onclick="switchTab('form')" 
        class="flex-1 py-3 px-4 rounded-xl text-center transition flex items-center justify-center gap-2 bg-teal-600 text-white shadow-sm">
        <i class="fa-solid fa-pen-to-square"></i>
        <span>填寫報名表單</span>
      </button>
      <button id="tabBtnRoster" onclick="switchTab('roster')" 
        class="flex-1 py-3 px-4 rounded-xl text-center transition flex items-center justify-center gap-2 text-slate-600 hover:text-slate-900 hover:bg-slate-50">
        <i class="fa-solid fa-clipboard-list"></i>
        <span>即時報名狀態</span>
        <span id="totalSignupsBadge" class="ml-1 px-2 py-0.5 text-xs rounded-full bg-slate-200 text-slate-700">0</span>
      </button>
    </div>

    <section id="viewForm" class="space-y-4">
      <div class="bg-white rounded-2xl p-4 sm:p-6 shadow-sm border border-slate-200 space-y-6">
        
        <div class="border-b border-slate-100 pb-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
          <div>
            <h2 class="text-lg font-bold text-slate-900 flex items-center gap-2">
              <i class="fa-solid fa-user-plus text-teal-600"></i>
              登記參加班表
            </h2>
            <p class="text-xs text-slate-500 mt-0.5">請填寫您的名字，並勾選預備參與的展示架時段</p>
          </div>
          
          <button onclick="requestAdminAuth(() => openShiftModal())" 
            class="self-start sm:self-auto text-xs px-3 py-1.5 rounded-lg bg-teal-50 hover:bg-teal-100 text-teal-700 border border-teal-200 font-medium transition flex items-center gap-1.5">
            <i class="fa-solid fa-plus text-teal-600"></i>
            <span>新增/管理時段</span>
          </button>
        </div>

        <form id="signupForm" onsubmit="handleSignupSubmit(event)" class="space-y-6">
          
          <!-- Participant Name Input -->
          <div class="space-y-1.5">
            <label for="userNameInput" class="block text-sm font-bold text-slate-700">
              您的姓名 <span class="text-rose-500">*</span>
            </label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                <i class="fa-solid fa-user"></i>
              </div>
              <input type="text" id="userNameInput" required placeholder="姓名" 
                class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-teal-500 focus:border-teal-500 outline-none transition text-sm text-slate-800 placeholder-slate-400">
            </div>
          </div>

          <!-- Participant Optional Note Input -->
          <div class="space-y-1.5">
            <label for="userNoteInput" class="block text-sm font-bold text-slate-700">
              備註說明 <span class="text-xs font-normal text-slate-400">(選填：提早離開、晚點到達...)</span>
            </label>
            <input type="text" id="userNoteInput" placeholder="填寫補充訊息..." 
              class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-teal-500 focus:border-teal-500 outline-none transition text-sm text-slate-800 placeholder-slate-400">
          </div>

          <!-- Shift Checkbox List Container -->
          <div class="space-y-2">
            <div class="flex items-center justify-between">
              <label class="block text-sm font-bold text-slate-700">
                選擇參與時段 <span class="text-rose-500">*</span> <span class="text-xs font-normal text-slate-500">(可複選)</span>
              </label>
              <span class="text-xs text-slate-400">點擊卡片即可勾選</span>
            </div>

            <div id="formShiftOptions" class="space-y-3">
              <!-- Dynamically populated via JavaScript -->
            </div>
          </div>

          <!-- Submit Button -->
          <button type="submit" 
            class="w-full py-3.5 px-6 rounded-xl bg-teal-600 hover:bg-teal-700 text-white font-bold shadow-md hover:shadow-lg transition active:scale-[0.99] flex items-center justify-center gap-2 text-base">
            <i class="fa-solid fa-paper-plane"></i>
            <span>確認送出報名</span>
          </button>
        </form>

      </div>
    </section>

    <section id="viewRoster" class="hidden space-y-4">
      <div class="bg-white rounded-2xl p-4 sm:p-6 shadow-sm border border-slate-200 space-y-4">
        
        <!-- Header Controls & Search Bar -->
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-slate-100 pb-4">
          <div>
            <h2 class="text-lg font-bold text-slate-900 flex items-center gap-2">
              <i class="fa-solid fa-users text-teal-600"></i>
              班表報名名冊
            </h2>
            <p class="text-xs text-slate-500 mt-0.5">即時顯示所有人報名狀態；管理者可編輯/刪除時段與成員</p>
          </div>

          <div class="flex items-center gap-2 flex-wrap">
            <button onclick="openLineCopyModal()" 
              class="px-3 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold transition flex items-center gap-1.5 shadow-sm">
              <i class="fa-brands fa-line text-sm"></i>
              <span>複製 LINE 班表文字</span>
            </button>
            <button onclick="requestAdminAuth(() => openShiftModal())" 
              class="px-3 py-1.5 rounded-lg bg-teal-50 hover:bg-teal-100 text-teal-700 border border-teal-200 text-xs font-semibold transition flex items-center gap-1">
              <i class="fa-solid fa-plus"></i>
              <span>新增時段</span>
            </button>
          </div>
        </div>

        <!-- Filter & Search Input -->
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
            <i class="fa-solid fa-magnifying-glass text-xs"></i>
          </div>
          <input type="text" id="rosterSearchInput" oninput="renderRosterView()" placeholder="搜尋姓名或地點..." 
            class="w-full pl-9 pr-4 py-2 rounded-xl bg-slate-50 border border-slate-200 text-xs focus:ring-2 focus:ring-teal-500 focus:bg-white outline-none transition">
        </div>

        <!-- Shift Roster Cards List -->
        <div id="rosterCardsList" class="space-y-4">
          <!-- Dynamically populated via JavaScript -->
        </div>

        <!-- Reset Sample Data Button (Footer) -->
        <div class="pt-4 border-t border-slate-100 flex items-center justify-between text-xs text-slate-400">
          <span>如需重置測試資料請點擊右側按鈕：</span>
          <button onclick="requestAdminAuth(confirmResetData)" 
            class="text-rose-500 hover:text-rose-700 font-medium underline flex items-center gap-1">
            <i class="fa-solid fa-rotate-left"></i>
            <span>重置範例資料</span>
          </button>
        </div>

      </div>
    </section>

  </main>

  <!-- 1. Admin Auth Password Modal -->
  <div id="adminAuthModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-xl border border-slate-100 space-y-4 transform transition-all">
      <div class="flex items-center justify-between border-b border-slate-100 pb-3">
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 rounded-lg bg-amber-100 text-amber-700 flex items-center justify-center font-bold">
            <i class="fa-solid fa-shield-halved"></i>
          </div>
          <h3 class="font-bold text-slate-900">管理者驗證</h3>
        </div>
        <button onclick="closeAdminAuthModal()" class="text-slate-400 hover:text-slate-600 p-1">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <p class="text-xs text-slate-500 leading-relaxed">
        此操作屬於管理者功能，請輸入管理者權限密碼進行解鎖：
      </p>

      <form onsubmit="handleAdminAuthSubmit(event)" class="space-y-4">
        <div class="space-y-1">
          <label class="block text-xs font-bold text-slate-700">管理者密碼</label>
          <div class="relative">
            <input type="password" id="adminPasswordInput" required placeholder="請輸入密碼..." 
              class="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm focus:ring-2 focus:ring-teal-500 outline-none">
            <button type="button" onclick="togglePasswordVisibility()" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600">
              <i id="passwordEyeIcon" class="fa-solid fa-eye"></i>
            </button>
          </div>
        </div>

        <div class="flex gap-2">
          <button type="button" onclick="closeAdminAuthModal()" class="flex-1 py-2 rounded-xl border border-slate-200 text-xs font-semibold text-slate-600 hover:bg-slate-50">
            取消
          </button>
          <button type="submit" class="flex-1 py-2 rounded-xl bg-teal-600 hover:bg-teal-700 text-white text-xs font-bold shadow transition">
            驗證並解鎖
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- 2. Add / Edit Shift Modal -->
  <div id="shiftModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl border border-slate-100 space-y-4">
      <div class="flex items-center justify-between border-b border-slate-100 pb-3">
        <h3 id="shiftModalTitle" class="font-bold text-slate-900 flex items-center gap-2">
          <i class="fa-solid fa-clock-rotate-left text-teal-600"></i>
          <span>編輯時段</span>
        </h3>
        <button onclick="closeShiftModal()" class="text-slate-400 hover:text-slate-600 p-1">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <form id="shiftForm" onsubmit="handleShiftFormSubmit(event)" class="space-y-4 text-xs">
        <input type="hidden" id="editingShiftId" value="">

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block font-bold text-slate-700 mb-1">輪值星期</label>
            <select id="shiftDayOffset" required class="w-full px-3 py-2 rounded-xl border border-slate-300 text-xs focus:ring-2 focus:ring-teal-500 outline-none">
              <option value="2">星期二</option>
              <option value="5">星期五</option>
              <option value="6">星期六</option>
              <option value="0">星期日</option>
              <option value="1">星期一</option>
              <option value="3">星期三</option>
              <option value="4">星期四</option>
            </select>
          </div>
          <div>
            <label class="block font-bold text-slate-700 mb-1">時間範圍</label>
            <input type="text" id="shiftTimeText" required placeholder="例如: 14:30 - 16:00" 
              class="w-full px-3 py-2 rounded-xl border border-slate-300 text-xs focus:ring-2 focus:ring-teal-500 outline-none">
          </div>
        </div>

        <div>
          <label class="block font-bold text-slate-700 mb-1">地點名稱</label>
          <input type="text" id="shiftPlaceText" required placeholder="例如: 鎮立圖書館 / 夜市" 
            class="w-full px-3 py-2 rounded-xl border border-slate-300 text-xs focus:ring-2 focus:ring-teal-500 outline-none">
        </div>

        <div>
          <label class="block font-bold text-slate-700 mb-1">備註/說明 <span class="font-normal text-slate-400">(選填)</span></label>
          <input type="text" id="shiftNoteText" placeholder="例如: 門口大樹旁展示架" 
            class="w-full px-3 py-2 rounded-xl border border-slate-300 text-xs focus:ring-2 focus:ring-teal-500 outline-none">
        </div>

        <div class="flex justify-end gap-2 pt-2 border-t border-slate-100">
          <button type="button" onclick="closeShiftModal()" class="px-4 py-2 rounded-xl border border-slate-200 font-semibold text-slate-600 hover:bg-slate-50">
            取消
          </button>
          <button type="submit" class="px-5 py-2 rounded-xl bg-teal-600 hover:bg-teal-700 text-white font-bold shadow">
            儲存變更
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- 3. LINE Schedule Copy Modal -->
  <div id="lineCopyModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-xl border border-slate-100 space-y-4">
      <div class="flex items-center justify-between border-b border-slate-100 pb-3">
        <h3 class="font-bold text-slate-900 flex items-center gap-2">
          <i class="fa-brands fa-line text-emerald-600 text-xl"></i>
          <span>複製 LINE 文字班表</span>
        </h3>
        <button onclick="closeLineCopyModal()" class="text-slate-400 hover:text-slate-600 p-1">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <textarea id="lineCopyTextarea" readonly class="w-full h-56 p-3 rounded-xl bg-slate-50 border border-slate-200 text-xs font-mono text-slate-700 outline-none resize-none focus:ring-2 focus:ring-teal-500"></textarea>

      <div class="flex justify-between items-center pt-2">
        <span class="text-2xs text-slate-400">貼心提示: 點擊右側按鈕即可複製並貼至 LINE 群組</span>
        <div class="flex gap-2">
          <button onclick="closeLineCopyModal()" class="px-4 py-2 rounded-xl border border-slate-200 text-xs font-semibold text-slate-600 hover:bg-slate-50">
            關閉
          </button>
          <button onclick="executeCopyLineText()" class="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold shadow flex items-center gap-1.5">
            <i class="fa-regular fa-copy"></i>
            <span>複製剪貼簿</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- 4. Time Simulation Modal -->
  <div id="timeSimModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-xl border border-slate-100 space-y-4">
      <div class="flex items-center justify-between border-b border-slate-100 pb-3">
        <h3 class="font-bold text-slate-900 flex items-center gap-2">
          <i class="fa-solid fa-vial text-purple-600"></i>
          <span>測試週六 16:00 自動換週</span>
        </h3>
        <button onclick="closeTimeSimModal()" class="text-slate-400 hover:text-slate-600 p-1">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <p class="text-xs text-slate-500 leading-relaxed">
        系統會在每週六 16:00 自動切換至下週的班表日期。您可手動切換時間情境進行預覽：
      </p>

      <div class="space-y-2 text-xs">
        <button onclick="setSimulatedTime(false)" class="w-full py-2.5 px-3 rounded-xl border border-slate-200 hover:bg-slate-50 text-left font-medium flex items-center justify-between">
          <span>1. 使用真實當前時間</span>
          <i class="fa-solid fa-check text-teal-600" id="simModeRealIcon"></i>
        </button>
        <button onclick="setSimulatedTime(true)" class="w-full py-2.5 px-3 rounded-xl border border-purple-200 bg-purple-50/50 hover:bg-purple-50 text-left font-medium text-purple-900 flex items-center justify-between">
          <span>2. 模擬超過週六 16:00 (預覽下週)</span>
          <i class="fa-solid fa-check text-purple-600 hidden" id="simModeNextIcon"></i>
        </button>
      </div>

      <button onclick="closeTimeSimModal()" class="w-full py-2 rounded-xl bg-slate-800 hover:bg-slate-900 text-white text-xs font-bold transition">
        完成
      </button>
    </div>
  </div>

  <script>
    // System Password & Storage Keys
    const ADMIN_PASSWORD = "1914";
    const STORAGE_KEY_SHIFTS = "puli_shifts_v1";
    const STORAGE_KEY_ROSTER = "puli_roster_v1";

    // Application State
    let isAdminUnlocked = false;
    let pendingAdminCallback = null;
    let isSimulatingNextWeek = false;

    // Default Shifts Template
    const DEFAULT_SHIFTS = [
      { id: "shift_1", dayOffset: 2, time: "14:30 - 16:00", place: "鎮立圖書館", note: "" },
      { id: "shift_2", dayOffset: 5, time: "19:00 - 21:00", place: "夜市", note: "" },
      { id: "shift_3", dayOffset: 6, time: "07:30 - 08:30", place: "廖姊妹家", note: "" },
      { id: "shift_4", dayOffset: 6, time: "15:00 - 17:00", place: "日月潭文武廟觀景台", note: "" }
    ];

    // Default Initial Roster
    const DEFAULT_ROSTER = {
      "shift_1": [],
      "shift_2": [],
      "shift_3": [{ name: "廖家誼", note: "" }],
      "shift_4": []
    };

    let shiftsData = [];
    let rosterData = {};

    function loadData() {
      try {
        const localShifts = localStorage.getItem(STORAGE_KEY_SHIFTS);
        const localRoster = localStorage.getItem(STORAGE_KEY_ROSTER);

        shiftsData = localShifts ? JSON.parse(localShifts) : [...DEFAULT_SHIFTS];
        rosterData = localRoster ? JSON.parse(localRoster) : JSON.parse(JSON.stringify(DEFAULT_ROSTER));
      } catch (e) {
        console.error("Storage loading error:", e);
        shiftsData = [...DEFAULT_SHIFTS];
        rosterData = JSON.parse(JSON.stringify(DEFAULT_ROSTER));
      }
    }

    function saveData() {
      try {
        localStorage.setItem(STORAGE_KEY_SHIFTS, JSON.stringify(shiftsData));
        localStorage.setItem(STORAGE_KEY_ROSTER, JSON.stringify(rosterData));
      } catch (e) {
        console.error("Storage saving error:", e);
      }
    }

    function confirmResetData() {
      if (confirm("確定要重置為初始範例班表資料嗎？（所有手動修改與新報名將還原）")) {
        shiftsData = [...DEFAULT_SHIFTS];
        rosterData = JSON.parse(JSON.stringify(DEFAULT_ROSTER));
        saveData();
        renderAllViews();
        showToast("已成功重置為範例資料", "success");
      }
    }

    function getTargetWeekDateInfo(dayOffset) {
      let now = new Date();
      if (isSimulatingNextWeek) {
        now.setDate(now.getDate() + 7);
      }

      const currentDay = now.getDay(); // 0(Sun) - 6(Sat)
      const currentHour = now.getHours();

      let baseSunday = new Date(now);
      baseSunday.setHours(0, 0, 0, 0);

      // Rollover rule: If Saturday >= 16:00, target next week
      if (currentDay === 6 && currentHour >= 16) {
        baseSunday.setDate(now.getDate() + (7 - currentDay));
      } else {
        baseSunday.setDate(now.getDate() - currentDay);
      }

      const targetDate = new Date(baseSunday);
      targetDate.setDate(baseSunday.getDate() + parseInt(dayOffset));

      const dayNames = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"];
      const monthStr = targetDate.getMonth() + 1;
      const dateStr = targetDate.getDate();
      const dayName = dayNames[targetDate.getDay()];

      return {
        fullText: `${monthStr}月${dateStr}日 ${dayName}`,
        shortText: `${monthStr}/${dateStr} (${dayName.replace("星期", "")})`
      };
    }

    function showToast(message, type = "info") {
      const container = document.getElementById("toastContainer");
      if (!container) return;
      
      const toast = document.createElement("div");
      const bgColors = {
        success: "bg-emerald-600 text-white",
        error: "bg-rose-600 text-white",
        warning: "bg-amber-500 text-white",
        info: "bg-slate-800 text-white"
      };

      const icons = {
        success: "fa-circle-check",
        error: "fa-circle-xmark",
        warning: "fa-triangle-exclamation",
        info: "fa-circle-info"
      };

      toast.className = `p-3 rounded-xl shadow-lg border border-white/20 text-xs font-semibold flex items-center justify-between gap-3 pointer-events-auto transform transition-all duration-300 translate-y-2 opacity-0 ${bgColors[type] || bgColors.info}`;
      toast.innerHTML = `
        <div class="flex items-center gap-2">
          <i class="fa-solid ${icons[type] || icons.info} text-sm"></i>
          <span>${escapeHtml(message)}</span>
        </div>
        <button onclick="this.parentElement.remove()" class="opacity-70 hover:opacity-100 p-0.5">
          <i class="fa-solid fa-xmark"></i>
        </button>
      `;

      container.appendChild(toast);
      
      requestAnimationFrame(() => {
        toast.classList.remove("translate-y-2", "opacity-0");
      });

      setTimeout(() => {
        toast.classList.add("opacity-0", "translate-y-2");
        setTimeout(() => toast.remove(), 300);
      }, 3200);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function switchTab(tabName) {
      const viewForm = document.getElementById("viewForm");
      const viewRoster = document.getElementById("viewRoster");
      const tabBtnForm = document.getElementById("tabBtnForm");
      const tabBtnRoster = document.getElementById("tabBtnRoster");

      if (tabName === 'form') {
        viewForm.classList.remove("hidden");
        viewRoster.classList.add("hidden");
        
        tabBtnForm.className = "flex-1 py-3 px-4 rounded-xl text-center transition flex items-center justify-center gap-2 bg-teal-600 text-white shadow-sm";
        tabBtnRoster.className = "flex-1 py-3 px-4 rounded-xl text-center transition flex items-center justify-center gap-2 text-slate-600 hover:text-slate-900 hover:bg-slate-50";
      } else {
        viewForm.classList.add("hidden");
        viewRoster.classList.remove("hidden");
        
        tabBtnRoster.className = "flex-1 py-3 px-4 rounded-xl text-center transition flex items-center justify-center gap-2 bg-teal-600 text-white shadow-sm";
        tabBtnForm.className = "flex-1 py-3 px-4 rounded-xl text-center transition flex items-center justify-center gap-2 text-slate-600 hover:text-slate-900 hover:bg-slate-50";
      }
    }

    function requestAdminAuth(callback) {
      if (isAdminUnlocked) {
        if (callback) callback();
        return;
      }
      pendingAdminCallback = callback;
      const pwdInput = document.getElementById("adminPasswordInput");
      if (pwdInput) pwdInput.value = "";
      document.getElementById("adminAuthModal").classList.remove("hidden");
      setTimeout(() => pwdInput && pwdInput.focus(), 100);
    }

    function closeAdminAuthModal() {
      document.getElementById("adminAuthModal").classList.add("hidden");
      pendingAdminCallback = null;
    }

    function handleAdminAuthSubmit(e) {
      e.preventDefault();
      const pwdInput = document.getElementById("adminPasswordInput");
      const pwd = pwdInput ? pwdInput.value : "";
      
      if (pwd === ADMIN_PASSWORD) {
        isAdminUnlocked = true;
        updateAdminLockUI();
        closeAdminAuthModal();
        showToast("管理者身分驗證成功！已解鎖權限", "success");
        if (pendingAdminCallback) {
          const cb = pendingAdminCallback;
          pendingAdminCallback = null;
          cb();
        }
      } else {
        showToast("密碼錯誤！請重新輸入", "error");
        if (pwdInput) pwdInput.select();
      }
    }

    function toggleAdminLock() {
      if (isAdminUnlocked) {
        isAdminUnlocked = false;
        updateAdminLockUI();
        showToast("已鎖定管理者權限", "info");
      } else {
        requestAdminAuth();
      }
    }

    function updateAdminLockUI() {
      const lockIcon = document.getElementById("adminLockIcon");
      const lockText = document.getElementById("adminStatusText");
      const btn = document.getElementById("adminStatusBtn");

      if (isAdminUnlocked) {
        if (lockIcon) lockIcon.className = "fa-solid fa-lock-open text-emerald-300";
        if (lockText) lockText.innerText = "管理者權限: 已解鎖";
        if (btn) btn.className = "px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition shadow-sm bg-emerald-800 text-emerald-100 border border-emerald-500/40";
      } else {
        if (lockIcon) lockIcon.className = "fa-solid fa-lock text-amber-300";
        if (lockText) lockText.innerText = "管理者權限: 已鎖定";
        if (btn) btn.className = "px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition shadow-sm bg-teal-800/60 hover:bg-teal-800 text-teal-100 border border-teal-500/30";
      }
      renderAllViews();
    }

    function togglePasswordVisibility() {
      const input = document.getElementById("adminPasswordInput");
      const icon = document.getElementById("passwordEyeIcon");
      if (input && icon) {
        if (input.type === "password") {
          input.type = "text";
          icon.className = "fa-solid fa-eye-slash";
        } else {
          input.type = "password";
          icon.className = "fa-solid fa-eye";
        }
      }
    }

    function openShiftModal(shiftId = null) {
      const modal = document.getElementById("shiftModal");
      const title = document.getElementById("shiftModalTitle");
      const hiddenId = document.getElementById("editingShiftId");
      
      if (shiftId) {
        const shift = shiftsData.find(s => s.id === shiftId);
        if (!shift) return;
        if (title) title.innerHTML = `<i class="fa-solid fa-pen-to-square text-teal-600"></i><span>編輯時段</span>`;
        if (hiddenId) hiddenId.value = shift.id;
        
        const daySelect = document.getElementById("shiftDayOffset");
        const timeInput = document.getElementById("shiftTimeText");
        const placeInput = document.getElementById("shiftPlaceText");
        const noteInput = document.getElementById("shiftNoteText");

        if (daySelect) daySelect.value = shift.dayOffset;
        if (timeInput) timeInput.value = shift.time;
        if (placeInput) placeInput.value = shift.place;
        if (noteInput) noteInput.value = shift.note || "";
      } else {
        if (title) title.innerHTML = `<i class="fa-solid fa-plus text-teal-600"></i><span>新增時段</span>`;
        if (hiddenId) hiddenId.value = "";
        const form = document.getElementById("shiftForm");
        if (form) form.reset();
      }

      if (modal) modal.classList.remove("hidden");
    }

    function closeShiftModal() {
      const modal = document.getElementById("shiftModal");
      if (modal) modal.classList.add("hidden");
    }

    function handleShiftFormSubmit(e) {
      e.preventDefault();
      const hiddenId = document.getElementById("editingShiftId");
      const daySelect = document.getElementById("shiftDayOffset");
      const timeInput = document.getElementById("shiftTimeText");
      const placeInput = document.getElementById("shiftPlaceText");
      const noteInput = document.getElementById("shiftNoteText");

      const shiftId = hiddenId ? hiddenId.value : "";
      const dayOffset = daySelect ? parseInt(daySelect.value) : 2;
      const time = timeInput ? timeInput.value.trim() : "";
      const place = placeInput ? placeInput.value.trim() : "";
      const note = noteInput ? noteInput.value.trim() : "";

      if (shiftId) {
        const shift = shiftsData.find(s => s.id === shiftId);
        if (shift) {
          shift.dayOffset = dayOffset;
          shift.time = time;
          shift.place = place;
          shift.note = note;
        }
        showToast("已更新時段資訊", "success");
      } else {
        const newId = "shift_" + Date.now();
        shiftsData.push({ id: newId, dayOffset, time, place, note });
        rosterData[newId] = [];
        showToast("已成功新增時段", "success");
      }

      saveData();
      renderAllViews();
      closeShiftModal();
    }

    function openDeleteModal(shiftId, memberIndex = null, memberName = "") {
      if (memberIndex !== null) {
        if (confirm(`確定要將「${memberName}」從該班次移除嗎？`)) {
          if (rosterData[shiftId]) {
            rosterData[shiftId].splice(memberIndex, 1);
            saveData();
            renderAllViews();
            showToast(`已移除 ${memberName}`, "info");
          }
        }
      } else {
        const shift = shiftsData.find(s => s.id === shiftId);
        if (!shift) return;
        if (confirm(`確定要刪除時段「${shift.place} (${shift.time})」嗎？對應的報名紀錄也將被清除。`)) {
          shiftsData = shiftsData.filter(s => s.id !== shiftId);
          delete rosterData[shiftId];
          saveData();
          renderAllViews();
          showToast("已成功刪除時段", "info");
        }
      }
    }

    function handleSignupSubmit(e) {
      e.preventDefault();
      const nameInput = document.getElementById("userNameInput");
      const noteInput = document.getElementById("userNoteInput");

      const name = nameInput ? nameInput.value.trim() : "";
      const note = noteInput ? noteInput.value.trim() : "";
      
      const checkedBoxes = Array.from(document.querySelectorAll('input[name="selectedShifts"]:checked')).map(cb => cb.value);

      if (!name) {
        showToast("請填寫您的姓名", "warning");
        return;
      }

      if (checkedBoxes.length === 0) {
        showToast("請至少勾選一個欲參與的時段", "warning");
        return;
      }

      let addedCount = 0;
      checkedBoxes.forEach(shiftId => {
        if (!rosterData[shiftId]) {
          rosterData[shiftId] = [];
        }
        const exists = rosterData[shiftId].some(m => m.name === name);
        if (!exists) {
          rosterData[shiftId].push({ name, note });
          addedCount++;
        }
      });

      saveData();
      renderAllViews();

      if (nameInput) nameInput.value = "";
      if (noteInput) noteInput.value = "";

      showToast(`感謝 ${name}！已成功報名 ${addedCount} 個班次`, "success");
      switchTab("roster");
    }

    function renderAllViews() {
      const dateSample = getTargetWeekDateInfo(2);
      const targetBadge = document.getElementById("targetWeekBadge");
      if (targetBadge) {
        const span = targetBadge.querySelector("span");
        if (span) span.innerText = `當前排班週期：${dateSample.fullText.split(' ')[0]} 週 (週六 16:00 自動換週)`;
      }

      let totalCount = 0;
      Object.values(rosterData).forEach(list => totalCount += (list ? list.length : 0));
      const totalBadge = document.getElementById("totalSignupsBadge");
      if (totalBadge) totalBadge.innerText = totalCount;

      renderFormView();
      renderRosterView();
    }

    function renderFormView() {
      const container = document.getElementById("formShiftOptions");
      if (!container) return;

      if (shiftsData.length === 0) {
        container.innerHTML = `
          <div class="text-center py-8 text-slate-400 bg-slate-50 rounded-xl border border-dashed border-slate-200 text-xs">
            目前尚無設定任何班表時段，請點擊上方「新增/管理時段」進行建立
          </div>
        `;
        return;
      }

      container.innerHTML = shiftsData.map(shift => {
        const dateInfo = getTargetWeekDateInfo(shift.dayOffset);
        const enrolledList = rosterData[shift.id] || [];
        const enrolledCount = enrolledList.length;

        return `
          <div class="group relative bg-white border border-slate-200 rounded-xl p-3.5 hover:border-teal-400 transition shadow-2xs flex items-center justify-between gap-3">
            
            <label class="flex items-start gap-3 flex-1 cursor-pointer min-w-0">
              <input type="checkbox" name="selectedShifts" value="${shift.id}" 
                class="mt-1 w-4 h-4 text-teal-600 rounded border-slate-300 focus:ring-teal-500 cursor-pointer shrink-0">
              <div class="min-w-0">
                <div class="flex items-center gap-2 flex-wrap">
                  <span class="font-bold text-slate-900 text-sm">${dateInfo.fullText}</span>
                  <span class="px-2 py-0.5 rounded text-2xs font-bold bg-teal-50 text-teal-700 border border-teal-200/60">${shift.time}</span>
                </div>
                <div class="text-xs font-semibold text-slate-700 mt-1 flex items-center gap-1.5">
                  <i class="fa-solid fa-location-dot text-rose-500"></i>
                  <span>${escapeHtml(shift.place)}</span>
                  ${shift.note ? `<span class="text-slate-400 font-normal">(${escapeHtml(shift.note)})</span>` : ''}
                </div>
              </div>
            </label>

            <div class="flex items-center gap-2 shrink-0">
              <span class="px-2.5 py-1 rounded-full text-xs font-semibold ${enrolledCount > 0 ? 'bg-teal-100 text-teal-800' : 'bg-slate-100 text-slate-500'}">
                ${enrolledCount > 0 ? `已報名 ${enrolledCount} 人` : '目前尚無人報名'}
              </span>

              <div class="flex items-center gap-1 border-l border-slate-100 pl-2">
                <button type="button" onclick="requestAdminAuth(() => openShiftModal('${shift.id}'))" 
                  title="編輯時段 (管理者)"
                  class="p-1.5 text-slate-400 hover:text-teal-600 hover:bg-slate-100 rounded-lg transition">
                  <i class="fa-solid fa-pen-to-square text-xs"></i>
                </button>
                <button type="button" onclick="requestAdminAuth(() => openDeleteModal('${shift.id}'))" 
                  title="刪除時段 (管理者)"
                  class="p-1.5 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-lg transition">
                  <i class="fa-solid fa-trash-can text-xs"></i>
                </button>
              </div>
            </div>

          </div>
        `;
      }).join('');
    }

    function renderRosterView() {
      const container = document.getElementById("rosterCardsList");
      if (!container) return;

      const searchInput = document.getElementById("rosterSearchInput");
      const searchKeyword = (searchInput?.value || "").trim().toLowerCase();

      if (shiftsData.length === 0) {
        container.innerHTML = `
          <div class="text-center py-10 text-slate-400 bg-slate-50 rounded-2xl border border-dashed border-slate-200 text-xs">
            目前尚無設定任何班次時段
          </div>
        `;
        return;
      }

      container.innerHTML = shiftsData.map(shift => {
        const dateInfo = getTargetWeekDateInfo(shift.dayOffset);
        let rawList = rosterData[shift.id] || [];

        if (searchKeyword) {
          rawList = rawList.filter(p => 
            p.name.toLowerCase().includes(searchKeyword) || 
            shift.place.toLowerCase().includes(searchKeyword)
          );
        }

        return `
          <div class="bg-white border border-slate-200/90 rounded-2xl p-4 shadow-2xs hover:shadow-sm transition space-y-3">
            
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 border-b border-slate-100 pb-3">
              <div>
                <div class="flex items-center gap-2 flex-wrap">
                  <span class="font-bold text-slate-900 text-sm">${dateInfo.fullText}</span>
                  <span class="px-2 py-0.5 rounded text-2xs font-bold bg-slate-100 text-slate-700">${shift.time}</span>
                </div>
                <div class="text-xs font-semibold text-teal-800 mt-1 flex items-center gap-1.5">
                  <i class="fa-solid fa-location-dot text-rose-500"></i>
                  <span>${escapeHtml(shift.place)}</span>
                  ${shift.note ? `<span class="text-slate-400 font-normal">(${escapeHtml(shift.note)})</span>` : ''}
                </div>
              </div>

              <div class="flex items-center justify-between sm:justify-end gap-2 shrink-0">
                <span class="text-xs font-bold text-slate-600 bg-slate-100 px-2.5 py-1 rounded-lg">
                  已報名 ${rawList.length} 人
                </span>
                <div class="flex items-center gap-1">
                  <button onclick="requestAdminAuth(() => openShiftModal('${shift.id}'))" 
                    title="編輯時段 (管理者)" 
                    class="p-1.5 text-slate-400 hover:text-teal-600 hover:bg-slate-100 rounded-lg transition text-xs">
                    <i class="fa-solid fa-pen-to-square"></i>
                  </button>
                  <button onclick="requestAdminAuth(() => openDeleteModal('${shift.id}'))" 
                    title="刪除時段 (管理者)" 
                    class="p-1.5 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-lg transition text-xs">
                    <i class="fa-solid fa-trash-can"></i>
                  </button>
                </div>
              </div>
            </div>

            <div>
            ${rawList.length === 0 ? `
              <div class="text-center py-3 text-slate-400 text-xs">
                <i class="fa-regular fa-folder-open text-xl mb-1 block"></i>
                目前該班次尚無人登記
              </div>
            ` : `
              <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-2.5">
                ${rawList.map((person, idx) => `
                  <div class="bg-slate-50 border border-slate-200/80 rounded-xl p-2.5 flex items-center justify-between group hover:border-teal-400 transition">
                    <div class="flex items-center gap-2">
                      <div class="w-7 h-7 rounded-full bg-teal-100 text-teal-800 flex items-center justify-center font-bold text-xs shrink-0">
                        ${person.name.charAt(0)}
                      </div>
                      <div class="min-w-0">
                        <div class="font-bold text-slate-800 text-xs truncate">${escapeHtml(person.name)}</div>
                        ${person.note ? `<div class="text-2xs text-amber-600 truncate">${escapeHtml(person.note)}</div>` : ''}
                      </div>
                    </div>
                    <button onclick="requestAdminAuth(() => openDeleteModal('${shift.id}', ${idx}, '${escapeHtml(person.name)}'))" 
                      title="移除成員 (需要管理者權限)"
                      class="text-slate-300 hover:text-rose-500 p-1 rounded hover:bg-rose-50 transition">
                      <i class="fa-solid fa-xmark text-xs"></i>
                    </button>
                  </div>
                `).join('')}
              </div>
            `}
          </div>

        </div>
        `;
      }).join('');
    }

    function generateLineText() {
      const sampleDate = getTargetWeekDateInfo(2);
      let text = `【埔里會眾展示架安排名單】\n`;
      text += `📅 週期：${sampleDate.fullText.split(' ')[0]} 週\n`;
      text += `────────────────────\n\n`;

      shiftsData.forEach(shift => {
        const dateInfo = getTargetWeekDateInfo(shift.dayOffset);
        const list = rosterData[shift.id] || [];
        const namesStr = list.map(p => p.name + (p.note ? `(${p.note})` : '')).join('、');

        text += `📌 ${dateInfo.fullText} ${shift.time}\n`;
        text += `📍 地點：${shift.place}${shift.note ? ' (' + shift.note + ')' : ''}\n`;
        text += `👥 參與名單：${namesStr || '尚無人報名'}\n\n`;
      });

      text += `（請大家準時前往，謝謝弟兄姊妹的熱心配搭！）`;
      return text;
    }

    function openLineCopyModal() {
      const textarea = document.getElementById("lineCopyTextarea");
      if (textarea) textarea.value = generateLineText();
      const modal = document.getElementById("lineCopyModal");
      if (modal) modal.classList.remove("hidden");
    }

    function closeLineCopyModal() {
      const modal = document.getElementById("lineCopyModal");
      if (modal) modal.classList.add("hidden");
    }

    function executeCopyLineText() {
      const textarea = document.getElementById("lineCopyTextarea");
      if (!textarea) return;
      textarea.select();
      try {
        document.execCommand('copy');
        showToast("已成功複製 LINE 班表文字！", "success");
        closeLineCopyModal();
      } catch (err) {
        showToast("複製失敗，請手動選取文字複製", "error");
      }
    }

    function toggleTimeSimModal() {
      const modal = document.getElementById("timeSimModal");
      if (modal) modal.classList.toggle("hidden");
    }

    function closeTimeSimModal() {
      const modal = document.getElementById("timeSimModal");
      if (modal) modal.classList.add("hidden");
    }

    function setSimulatedTime(isNext) {
      isSimulatingNextWeek = isNext;
      const realIcon = document.getElementById("simModeRealIcon");
      const nextIcon = document.getElementById("simModeNextIcon");
      
      if (realIcon) realIcon.classList.toggle("hidden", isNext);
      if (nextIcon) nextIcon.classList.toggle("hidden", !isNext);
      
      renderAllViews();
      showToast(isNext ? "已切換為：模擬週六 16:00 後 (預覽下週)" : "已還原為：真實時間", "info");
    }

    window.addEventListener("DOMContentLoaded", () => {
      loadData();
      renderAllViews();
      // Set default tab to Sign-up Form
      switchTab("form");
    });
  </script>

</body>
</html>
